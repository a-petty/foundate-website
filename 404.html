<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#18201e">
  <title>Page not found — Foundate AI</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <style>
    @font-face{font-family:"Geist";src:url("/assets/fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
    @font-face{font-family:"Geist Mono";src:url("/assets/fonts/GeistMono-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#17201e;color:#f7f8f4;font-family:"Geist","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:4rem clamp(1.35rem,5.2vw,6rem);max-width:1600px;width:100%;margin:0 auto}
    .wordmark{display:inline-flex;align-items:center;gap:.7rem;font-size:2.35rem;font-weight:650;letter-spacing:-.095em;line-height:1;color:inherit;text-decoration:none}
    .ai-mark{font-size:.875rem;font-weight:550;letter-spacing:.03em;border:1px solid currentColor;border-radius:4px;padding:.28rem .33rem;align-self:flex-start;margin-top:.12rem}
    .eyebrow{font-family:"Geist Mono",ui-monospace,Menlo,monospace;font-size:.82rem;letter-spacing:.08em;font-weight:500;color:#d8fb78;margin:3rem 0 1.5rem}
    h1{font-size:clamp(2.8rem,6vw,5.5rem);font-weight:600;letter-spacing:-.05em;line-height:1.05;margin:0 0 1.5rem;max-width:900px}
    p{font-size:1.1rem;line-height:1.7;color:#b4c1b9;max-width:520px;margin:0 0 2.5rem}
    .button{display:inline-flex;align-items:center;background:#d8fb78;color:#18201e;padding:1.05rem 1.7rem;border-radius:3px;font-size:1rem;font-weight:500;text-decoration:none}
    .button:hover{background:#e6ff9c}
    a:focus-visible{outline:3px solid #d8fb78;outline-offset:6px}
  </style>
</head>
<body>
  <main>
    <a class="wordmark" href="/" aria-label="Foundate AI home">foundate<span class="ai-mark">AI</span></a>
    <p class="eyebrow">404 / PAGE NOT FOUND</p>
    <h1>That page isn’t here.</h1>
    <p>The address may have changed, or the link may be out of date. Everything we publish lives on the home page.</p>
    <a class="button" href="/">Back to foundate.ai</a>
  </main>
</body>
</html>
