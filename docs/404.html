<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f5f2eb">
  <title>Page not found — Foundate AI</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <style>
    @font-face{font-family:"Zilla Slab";src:url("/assets/fonts/ZillaSlab-SemiBold.woff2") format("woff2");font-weight:600;font-display:swap}
    @font-face{font-family:"IBM Plex Sans";src:url("/assets/fonts/IBMPlexSans-Variable.woff2") format("woff2");font-weight:100 700;font-display:swap}
    @font-face{font-family:"IBM Plex Mono";src:url("/assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#f5f2eb;color:#1c1b18;font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:4rem clamp(1.35rem,5.2vw,6rem);max-width:1600px;width:100%;margin:0 auto}
    .wordmark{display:inline-flex;align-items:center;font-family:"Zilla Slab",Georgia,serif;font-size:2rem;font-weight:600;letter-spacing:-.01em;line-height:1;color:inherit;text-decoration:none}
    .eyebrow{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.82rem;letter-spacing:.08em;color:#1e4d3b;margin:3rem 0 1.5rem}
    h1{font-family:"Zilla Slab",Georgia,serif;font-size:clamp(2.8rem,6vw,5.2rem);font-weight:600;letter-spacing:-.02em;line-height:1.02;margin:0 0 1.5rem;max-width:900px}
    p{font-size:1.1rem;line-height:1.7;color:#45423a;max-width:520px;margin:0 0 2.5rem}
    .button{display:inline-flex;align-items:center;background:#1e4d3b;color:#f5f2eb;padding:1.05rem 1.7rem;border-radius:3px;font-size:1rem;font-weight:500;text-decoration:none}
    .button:hover{background:#163d2e}
    a:focus-visible{outline:3px solid #1e4d3b;outline-offset:6px}
  </style>
</head>
<body>
  <main>
    <a class="wordmark" href="/" aria-label="Foundate AI home">Foundate</a>
    <p class="eyebrow">404 / PAGE NOT FOUND</p>
    <h1>That page isn’t here.</h1>
    <p>The address may have changed, or the link may be out of date. Everything we publish lives on the home page.</p>
    <a class="button" href="/">Back to foundate.ai</a>
  </main>
</body>
</html>
